# Version Catalog - one central place for all versions.
#
# In the course (block 1, topic "project setup with Gradle") this file is the
# exhibit: versions are NOT scattered across the modules' build.gradle.kts
# files but bundled here. The modules then reference them type-safely as
# libs.kotlinx.coroutines.core (dot instead of hyphen).

[versions]
kotlin = "2.4.20"
coroutines = "1.11.0"
kotest = "6.2.5"
mockk = "1.14.11"
junit = "6.1.3"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }

kotest-runner-junit5 = { module = "io.kotest:kotest-runner-junit5", version.ref = "kotest" }
kotest-assertions-core = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }

mockk = { module = "io.mockk:mockk", version.ref = "mockk" }

# The BOM fixes the versions of all JUnit artifacts, which is why jupiter and
# launcher appear below without a version of their own.
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
